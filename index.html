<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Harry Jaggardyes
    's Dashboard</title>
  <style>
    :root {
      --text-primary: #FAFAFA;
      --text-secondary: #B8B6B0;
      --text-tertiary: #76746E;
      --success: #6BE3A4;
      --warning: #F2C063;
      --danger: #FF6B6B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { min-height: 100vh; background: #050506; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 24px 64px;
      padding-top: max(24px, env(safe-area-inset-top, 24px));
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse at 82% 14%, rgba(224,118,88,0.16) 0%, transparent 55%),
        radial-gradient(ellipse at 18% 90%, rgba(180,180,200,0.06) 0%, transparent 55%);
      filter: blur(40px);
      animation: bgDrift 36s alternate ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,0.014) 0.5px, transparent 0.5px);
      background-size: 3px 3px;
    }

    @keyframes bgDrift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-12px, 10px) scale(1.03); }
      100% { transform: translate(10px, -8px) scale(0.97); }
    }

    body > * { position: relative; z-index: 1; }

    /* ── PAGE TITLE ── */
    .dash-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }

    @media (max-width: 480px) { .dash-title { font-size: 22px; } }

    /* ── GOAL TICKER ── */
    .ticker-row { margin-bottom: 18px; }

    .goal-ticker {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 12px;
      background-image:
        linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.30) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
    }

    .goal-ticker::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      animation: tickerSweep 8s linear infinite;
      pointer-events: none;
    }

    @keyframes tickerSweep {
      0%   { left: -40%; }
      100% { left: 110%; }
    }

    .goal-ticker-led { display: flex; align-items: center; }

    .goal-ticker-led-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6BE3A4;
      box-shadow: 0 0 8px rgba(107,227,164,0.7);
      animation: ledPulse 1.6s ease-in-out infinite;
    }

    @keyframes ledPulse {
      0%   { opacity: 1; transform: scale(1); }
      50%  { opacity: 0.45; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .goal-ticker-label {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .goal-ticker-stage {
      flex: 1;
      height: 22px;
      position: relative;
      overflow: hidden;
    }

    .goal-ticker-row {
      display: flex;
      align-items: center;
      height: 22px;
      gap: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      white-space: nowrap;
      position: absolute;
      width: 100%;
    }

    .goal-ticker-row.is-leaving  { animation: ticker-leave  0.45s cubic-bezier(0.55,0,0.55,1) forwards; }
    .goal-ticker-row.is-entering { animation: ticker-enter  0.45s cubic-bezier(0.22,1,0.36,1) forwards; }

    @keyframes ticker-leave  { 0% { opacity:1; transform:translateY(0);     } 100% { opacity:0; transform:translateY(-100%); } }
    @keyframes ticker-enter  { 0% { opacity:0; transform:translateY(100%);  } 100% { opacity:1; transform:translateY(0);      } }

    .goal-ticker-status { width: 18px; flex-shrink: 0; display: flex; align-items: center; }
    .goal-ticker-status[data-status="done"]    { color: var(--success); }
    .goal-ticker-status[data-status="pending"] { color: var(--text-tertiary); }
    .goal-ticker-status[data-status="empty"]   { color: var(--text-tertiary); }

    .goal-ticker-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    .goal-ticker-meta {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .goal-ticker       { padding: 9px 12px; }
      .goal-ticker-label { font-size: 9px; letter-spacing: 0.14em; }
      .goal-ticker-row   { font-size: 12px; }
      .goal-ticker-meta  { font-size: 10px; padding: 2px 7px; }
    }

    /* ── DAY RING ── */
    .day-ring-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 20px 22px;
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }

    .day-ring-wrap {
      width: 168px;
      height: 168px;
      position: relative;
      flex-shrink: 0;
    }

    .day-ring-svg { width: 168px; height: 168px; }

    .day-ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .day-ring-percent {
      font-size: 40px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .day-ring-phase {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-top: 5px;
    }

    .day-ring-clock {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .day-ring-info { max-width: 280px; display: flex; flex-direction: column; gap: 6px; }

    .day-ring-status   { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .day-ring-remaining { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size: 12px; color: var(--text-secondary); }
    .day-ring-hours    { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size: 11px; color: var(--text-tertiary); }

    @media (max-width: 480px) {
      .day-ring-wrap    { width: 144px; height: 144px; }
      .day-ring-svg     { width: 144px; height: 144px; }
      .day-ring-percent { font-size: 32px; }
      .day-ring-status  { font-size: 13px; }
    }

    /* ── SECTION ── */
    .section { margin-bottom: 18px; }

    .section-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title::before { content: ''; width: 18px; height: 1px; background: var(--text-tertiary); opacity: 0.6; flex-shrink: 0; }
    .section-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent); }

    /* ── GM CARDS ── */
    .gm-card {
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 18px 22px;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      margin-bottom: 12px;
      transition: background 0.5s ease;
    }

    .gm-card.gm-all-done {
      background: radial-gradient(ellipse at 50% 0%, rgba(107,227,164,0.08) 0%, rgba(255,255,255,0.04) 60%);
    }

    .gm-card.gm-all-done .gm-progress-num  { color: var(--success); }
    .gm-card.gm-all-done .gm-progress-label { color: var(--success); }

    .gm-card-tomorrow .gm-progress-row { display: none; }

    /* Card header */
    .gm-card-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .gm-card-header-left { display: flex; flex-direction: column; }

    .gm-card-eyebrow {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 6px;
    }

    .gm-progress-row { display: flex; align-items: baseline; gap: 6px; }

    .gm-progress-num {
      font-size: 42px; font-weight: 700; letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums; color: var(--text-primary); line-height: 1; transition: color 0.3s;
    }

    .gm-progress-total {
      font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      font-size: 18px; color: var(--text-tertiary);
    }

    .gm-progress-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.10em;
      text-transform: uppercase; color: var(--text-tertiary); transition: color 0.3s;
    }

    /* Streak */
    .gm-streak {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.04); color: var(--text-tertiary);
      border: 1px solid transparent; transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .gm-streak.gm-streak-active {
      background: rgba(242,192,99,0.10); color: #F2C063; border-color: rgba(242,192,99,0.32);
    }

    .gm-streak-icon { font-size: 13px; }
    .gm-streak.gm-streak-active .gm-streak-icon { filter: drop-shadow(0 0 6px rgba(242,192,99,0.6)); }
    .gm-streak-num   { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; font-weight: 700; }
    .gm-streak-label { text-transform: uppercase; letter-spacing: 0.10em; font-size: 11px; }

    /* Bar */
    .gm-bar { display: flex; gap: 4px; height: 6px; margin-bottom: 16px; }
    .gm-bar:empty { display: none; }
    .gm-bar-seg { flex: 1; border-radius: 3px; background: rgba(255,255,255,0.10); transition: background 0.3s, box-shadow 0.3s; }
    .gm-bar-seg-done { background: #6BE3A4; box-shadow: 0 0 6px rgba(107,227,164,0.40); }

    /* Goal list */
    .gm-list { list-style: none; }

    .gm-goal-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; margin-bottom: 6px;
      background: rgba(255,255,255,0.035); border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06); transition: background 0.2s;
    }

    .gm-goal-row:hover { background: rgba(255,255,255,0.06); }
    .gm-goal-row:hover .gm-drag-handle,
    .gm-goal-row:hover .goal-delete { opacity: 1; }

    .gm-goal-row.gm-done { opacity: 0.45; background: rgba(107,227,164,0.04); }
    .gm-goal-row.gm-done .gm-goal-text { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.4); }

    .gm-goal-row.gm-queued { background: rgba(242,192,99,0.10); box-shadow: inset 3px 0 0 0 #F2C063; }
    .gm-goal-row.gm-queued .gm-goal-text { color: #FFE2A8; }

    .gm-drag-handle {
      width: 14px; color: var(--text-tertiary); cursor: grab;
      opacity: 0; transition: opacity 0.2s; font-size: 14px;
      letter-spacing: -2px; flex-shrink: 0; user-select: none;
    }

    /* Checkbox */
    .gm-checkbox-wrap { position: relative; width: 22px; height: 22px; flex-shrink: 0; }
    .gm-checkbox-wrap input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }

    .gm-checkbox-custom {
      display: block; width: 22px; height: 22px; border-radius: 7px;
      border: 1.5px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.3);
      cursor: pointer; position: relative;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .gm-checkbox-wrap input:checked + .gm-checkbox-custom {
      background: #6BE3A4; border-color: #6BE3A4; box-shadow: 0 0 12px rgba(107,227,164,0.40);
    }

    .gm-checkbox-custom::after {
      content: ''; position: absolute; left: 6px; top: 3px;
      width: 6px; height: 10px;
      border: 2px solid #050506; border-top: none; border-left: none;
      transform: rotate(45deg) scale(0); transform-origin: center;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }

    .gm-checkbox-wrap input:checked + .gm-checkbox-custom::after { transform: rotate(45deg) scale(1); }

    .gm-checkbox-wrap input:disabled + .gm-checkbox-custom { cursor: not-allowed; opacity: 0.6; }

    .gm-goal-text {
      flex: 1; font-size: 13.5px; color: var(--text-primary);
      outline: none; min-width: 0; word-break: break-word;
    }

    .gm-goal-text[contenteditable="true"] {
      outline: 1px solid rgba(255,255,255,0.3); padding: 2px 4px; border-radius: 4px;
    }

    /* Queue btn */
    .gm-queue-btn {
      background: none; border: none; cursor: pointer; font-size: 14px;
      color: var(--text-tertiary); opacity: 0.55; padding: 2px;
      transition: opacity 0.2s, filter 0.2s, color 0.2s; flex-shrink: 0;
    }

    .gm-queue-btn.gm-queue-active { color: #F2C063; opacity: 1; filter: drop-shadow(0 0 4px rgba(242,192,99,0.65)); }
    .gm-queue-btn:disabled         { cursor: default; opacity: 0.3; }

    .gm-goal-row.is-queue-flashing { animation: gm-queue-flash 0.48s ease-out; }

    @keyframes gm-queue-flash {
      0%   { background: rgba(255,255,255,0.035); transform: scale(1); }
      40%  { background: rgba(242,192,99,0.32);   transform: scale(1.015); }
      100% { background: rgba(255,255,255,0.035); transform: scale(1); }
    }

    /* Delete btn */
    .goal-delete {
      background: none; border: none; cursor: pointer; font-size: 16px;
      color: var(--text-tertiary); opacity: 0.5; padding: 2px 4px;
      transition: color 0.2s, opacity 0.2s; flex-shrink: 0;
    }

    .goal-delete:hover { color: var(--danger); opacity: 1; }

    .empty-state { font-size: 12px; color: var(--text-tertiary); font-style: italic; padding: 14px 0; text-align: center; }

    /* Show more */
    .gm-show-more {
      display: flex; align-items: center; justify-content: center;
      padding: 10px 14px; margin-bottom: 6px; width: 100%;
      background: none; border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 12px; cursor: pointer; color: var(--text-tertiary); font-size: 12px;
      transition: color 0.2s, border-color 0.2s;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .gm-show-more:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.3); }

    /* Push button */
    .gm-push-btn {
      display: none; width: 100%; padding: 10px 14px; margin-top: 8px; margin-bottom: 8px;
      background: none; border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 12px; cursor: pointer; color: var(--text-tertiary); font-size: 12px;
      text-align: center; transition: color 0.2s, border-color 0.2s;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .gm-push-btn.visible { display: block; }
    .gm-push-btn:hover   { color: var(--text-primary); border-color: rgba(255,255,255,0.3); }

    /* Input row */
    .goal-input-wrap {
      display: flex; gap: 8px; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 14px; margin-top: 14px;
    }

    .goal-input-wrap input[type="text"] {
      flex: 1; padding: 11px 14px; border-radius: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-primary); font-size: 13px; outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: border-color 0.2s;
    }

    .goal-input-wrap input[type="text"]::placeholder { color: var(--text-tertiary); }
    .goal-input-wrap input[type="text"]:focus        { border-color: rgba(255,255,255,0.3); }

    .goal-add-btn {
      padding: 11px 20px; border-radius: 12px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
      color: #0A0A0B; font-weight: 700; font-size: 13px; border: none; cursor: pointer;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 4px 12px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .goal-add-btn:hover {
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 16px rgba(0,0,0,0.35);
    }

    .goal-polish-btn {
      padding: 11px 20px; border-radius: 12px;
      background: rgba(255,255,255,0.04); color: var(--text-primary); font-size: 13px;
      border: 1px solid rgba(255,255,255,0.10); cursor: pointer; white-space: nowrap;
      transition: transform 0.15s, background 0.15s;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .goal-polish-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.07); }

    .polish-status { font-size: 11px; color: var(--text-tertiary); min-height: 16px; margin-top: 6px; }

    .gm-tomorrow-subtext { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

    .gm-tomorrow-count {
      font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      font-size: 11px; text-transform: uppercase; font-variant-numeric: tabular-nums;
      color: var(--text-tertiary); white-space: nowrap;
    }

    .gm-drag-over { border-top: 2px solid rgba(255,255,255,0.3) !important; }
  </style>
</head>
<body>

  <h1 class="dash-title">Harry Jaggard's Jarvis</h1>

  <!-- Goal Ticker -->
  <div class="ticker-row">
    <div class="goal-ticker" id="goalTicker" aria-live="polite" aria-atomic="true">
      <div class="goal-ticker-led"><span class="goal-ticker-led-dot"></span></div>
      <div class="goal-ticker-label">GOALS</div>
      <div class="goal-ticker-stage" id="goalTickerStage">
        <div class="goal-ticker-row">
          <span class="goal-ticker-status" data-status="">·</span>
          <span class="goal-ticker-text">Loading…</span>
        </div>
      </div>
      <div class="goal-ticker-meta" id="goalTickerMeta">0/0</div>
    </div>
  </div>

  <!-- Day Ring -->
  <div class="day-ring-container">
    <div class="day-ring-wrap">
      <svg class="day-ring-svg" viewBox="0 0 120 120" id="dayRingSvg">
        <defs>
          <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
        <circle id="dayRingFill" cx="60" cy="60" r="52" fill="none"
          stroke="#FFD89E" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="326.726" stroke-dashoffset="326.726"
          filter="url(#ring-glow)" transform="rotate(-90 60 60)"
          style="transition: stroke-dashoffset 0.7s cubic-bezier(0.22,1,0.36,1), stroke 0.7s cubic-bezier(0.22,1,0.36,1);"/>
      </svg>
      <div class="day-ring-text">
        <div class="day-ring-percent" id="dayRingPercent">—</div>
        <div class="day-ring-phase"   id="dayRingPhase">SLEEPING</div>
        <div class="day-ring-clock"   id="dayRingClock">—</div>
      </div>
    </div>
    <div class="day-ring-info">
      <div class="day-ring-status"    id="dayRingStatus">😴 Still sleeping</div>
      <div class="day-ring-remaining" id="dayRingRemaining">—</div>
      <div class="day-ring-hours">8:00 AM – 12:00 AM</div>
    </div>
  </div>

  <!-- To Do List -->
  <div class="section">
    <div class="section-title">To Do List</div>

    <!-- TODAY -->
    <div class="gm-card" id="todayCard">
      <div class="gm-card-header">
        <div class="gm-card-header-left">
          <div class="gm-card-eyebrow" id="todayLabel">Today</div>
          <div class="gm-progress-row">
            <div class="gm-progress-num"   id="gmProgressNum">0</div>
            <div class="gm-progress-total" id="gmProgressTotal">/ 0</div>
            <div class="gm-progress-label" id="gmProgressLabel">no goals yet</div>
          </div>
        </div>
        <div class="gm-streak" id="gmStreak">
          <span class="gm-streak-icon">⚡</span>
          <span class="gm-streak-num"   id="gmStreakNum">0</span>
          <span class="gm-streak-label">day streak</span>
        </div>
      </div>
      <div class="gm-bar" id="gmBar"></div>
      <div id="emptyState" class="empty-state">No goals for today yet — add one below.</div>
      <ul id="goalList" class="gm-list"></ul>
      <button class="gm-push-btn" id="gmPushBtn">Push remaining to tomorrow →</button>
      <div class="goal-input-wrap">
        <input type="text" id="goalInput" placeholder="Add a goal for today…" autocomplete="off"/>
        <button class="goal-add-btn"    id="goalAddBtn">+ Add</button>
        <button class="goal-polish-btn" id="goalPolishBtn">✨ Polish</button>
      </div>
      <div class="polish-status" id="polishStatus"></div>
    </div>

    <!-- PLAN TOMORROW -->
    <div class="gm-card gm-card-tomorrow" id="tomorrowCard">
      <div class="gm-card-header">
        <div class="gm-card-header-left">
          <div class="gm-card-eyebrow" id="tomorrowLabel">Plan tomorrow</div>
          <div class="gm-tomorrow-subtext">Write tonight, locked until 6 AM.</div>
        </div>
        <div class="gm-tomorrow-count" id="gmTomorrowCount">0 planned</div>
      </div>
      <div id="tomorrowEmptyState" class="empty-state">Nothing planned for tomorrow yet.</div>
      <ul id="tomorrowList" class="gm-list"></ul>
      <div class="goal-input-wrap">
        <input type="text" id="tomorrowInput" placeholder="Plan a goal for tomorrow…" autocomplete="off"/>
        <button class="goal-add-btn"    id="tomorrowAddBtn">+ Add</button>
        <button class="goal-polish-btn" id="tomorrowPolishBtn">✨ Polish</button>
      </div>
      <div class="polish-status" id="tomorrowStatus"></div>
    </div>
  </div>

<script>
  const ANTHROPIC_API_KEY = '';
  const WAKE_HOUR  = 8;
  const SLEEP_HOUR = 24;

  // ── Storage ──
  function storeGet(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
  function storeSet(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
    if (key.startsWith('goals:')) window.dispatchEvent(new CustomEvent('goals-changed'));
  }
  function storeDelete(key) { localStorage.removeItem(key); }
  function storeListKeys(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) keys.push(k);
    }
    return keys;
  }

  // ── Dates ──
  function getActiveDateString() {
    const now = new Date();
    if (now.getHours() < 6) {
      const d = new Date(now); d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    }
    return now.toISOString().slice(0, 10);
  }

  function getTomorrowDateString() {
    const now = new Date();
    if (now.getHours() < 6) return now.toISOString().slice(0, 10);
    const d = new Date(now); d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${DAYS[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${d}`;
  }

  // ── Rollover ──
  function runRollover() {
    const active = getActiveDateString();
    const todayGoals = storeGet(`goals:${active}`) || [];
    const seen = new Set(todayGoals.map(g => g.text));
    let changed = false;

    for (const key of storeListKeys('goals:')) {
      const date = key.slice(6);
      if (date >= active) continue;
      const old = storeGet(key) || [];
      for (const g of old.filter(g => !g.done)) {
        if (!seen.has(g.text)) { todayGoals.push({ text: g.text, done: false }); seen.add(g.text); }
      }
      storeDelete(key);
      changed = true;
    }
    if (changed) localStorage.setItem(`goals:${active}`, JSON.stringify(todayGoals));
  }

  // ── Streak ──
  function runStreakCheck() {
    const active = getActiveDateString();
    const data = storeGet('goal_streak_v1') || { count: 0, lastProcessedDate: null };
    let { count, lastProcessedDate } = data;

    const dates = storeListKeys('goals:')
      .map(k => k.slice(6))
      .filter(d => d < active)
      .sort();

    for (const date of dates) {
      if (lastProcessedDate && date <= lastProcessedDate) continue;
      const goals = storeGet(`goals:${date}`) || [];
      if (goals.length === 0) { lastProcessedDate = date; continue; }
      count = goals.every(g => g.done) ? count + 1 : 0;
      lastProcessedDate = date;
    }
    storeSet('goal_streak_v1', { count, lastProcessedDate });
    return count;
  }

  // ── Render helpers ──
  function renderTodayHeader() {
    const active = getActiveDateString();
    const goals  = storeGet(`goals:${active}`) || [];
    const total  = goals.length;
    const done   = goals.filter(g => g.done).length;

    document.getElementById('todayLabel').textContent       = `Today — ${formatDate(active)}`;
    document.getElementById('gmProgressNum').textContent    = done;
    document.getElementById('gmProgressTotal').textContent  = `/ ${total}`;
    const lbl = document.getElementById('gmProgressLabel');
    lbl.textContent = total === 0 ? 'no goals yet' : (done === total ? 'all done — solid day' : 'complete');

    const bar = document.getElementById('gmBar');
    bar.innerHTML = '';
    goals.forEach(g => {
      const s = document.createElement('div');
      s.className = 'gm-bar-seg' + (g.done ? ' gm-bar-seg-done' : '');
      bar.appendChild(s);
    });

    document.getElementById('todayCard').classList.toggle('gm-all-done', total > 0 && done === total);
    document.getElementById('gmPushBtn').classList.toggle('visible', total > 0 && goals.some(g => !g.done));
  }

  function renderStreak() {
    const data  = storeGet('goal_streak_v1') || { count: 0 };
    const count = data.count || 0;
    document.getElementById('gmStreakNum').textContent = count;
    document.getElementById('gmStreak').classList.toggle('gm-streak-active', count > 0);
  }

  function renderTomorrowCount() {
    const tomorrow = getTomorrowDateString();
    const goals = storeGet(`goals:${tomorrow}`) || [];
    document.getElementById('gmTomorrowCount').textContent = `${goals.length} planned`;
    document.getElementById('tomorrowLabel').textContent   = `Plan tomorrow — ${formatDate(tomorrow)}`;
  }

  // ── Inline edit ──
  function makeInlineEdit(el, goals, idx, key, readOnly, onCommit) {
    if (readOnly) return;
    el.addEventListener('click', () => {
      if (el._editing) return;
      el._editing = true;
      el.contentEditable = 'true';
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el); range.collapse(false);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      const orig = goals[idx].text;

      function commit() {
        const t = el.textContent.trim();
        el.contentEditable = 'false'; el._editing = false;
        if (t && t !== orig) { goals[idx].text = t; storeSet(key, goals); }
        else el.textContent = orig;
        onCommit();
      }
      function cancel() { el.contentEditable = 'false'; el._editing = false; el.textContent = orig; }

      el.addEventListener('blur', commit, { once: true });
      el.addEventListener('keydown', function kd(e) {
        if (e.key === 'Enter')  { e.preventDefault(); el.removeEventListener('blur', commit); el.removeEventListener('keydown', kd); commit(); }
        if (e.key === 'Escape') { e.preventDefault(); el.removeEventListener('blur', commit); el.removeEventListener('keydown', kd); cancel(); }
      });
    });
  }

  // ── Drag reorder ──
  function wireDragReorder(listEl, key, readOnly, reload) {
    if (readOnly) return;
    let dragIdx = null;

    listEl.addEventListener('dragstart', e => {
      const li = e.target.closest('li[data-idx]');
      if (li) { dragIdx = +li.dataset.idx; e.dataTransfer.effectAllowed = 'move'; }
    });
    listEl.addEventListener('dragover', e => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      const li = e.target.closest('li[data-idx]');
      listEl.querySelectorAll('li').forEach(el => el.classList.remove('gm-drag-over'));
      if (li) li.classList.add('gm-drag-over');
    });
    listEl.addEventListener('dragleave', e => {
      const li = e.target.closest('li[data-idx]');
      if (li) li.classList.remove('gm-drag-over');
    });
    listEl.addEventListener('drop', e => {
      e.preventDefault();
      listEl.querySelectorAll('li').forEach(el => el.classList.remove('gm-drag-over'));
      const li = e.target.closest('li[data-idx]');
      if (!li || dragIdx === null) return;
      const dropIdx = +li.dataset.idx;
      if (dragIdx !== dropIdx) {
        const goals = storeGet(key) || [];
        const [item] = goals.splice(dragIdx, 1);
        goals.splice(dropIdx, 0, item);
        storeSet(key, goals);
        reload();
      }
      dragIdx = null;
    });
  }

  // ── Build row ──
  function buildGoalRow(g, idx, goals, key, readOnly, reload) {
    const li = document.createElement('li');
    li.className = 'gm-goal-row' + (g.done ? ' gm-done' : '') + (g.queued && !g.done ? ' gm-queued' : '');
    li.dataset.idx = idx;
    if (!readOnly) li.draggable = true;

    // Drag handle
    const handle = document.createElement('span');
    handle.className = 'gm-drag-handle'; handle.textContent = '⋮⋮';
    li.appendChild(handle);

    // Checkbox
    const cbWrap = document.createElement('label');
    cbWrap.className = 'gm-checkbox-wrap';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = g.done;
    if (readOnly) { cb.disabled = true; cb.title = 'Activates at 6 AM tomorrow'; }
    const cbCustom = document.createElement('span'); cbCustom.className = 'gm-checkbox-custom';
    cbWrap.appendChild(cb); cbWrap.appendChild(cbCustom);
    if (!readOnly) {
      cb.addEventListener('change', () => {
        goals[idx].done = cb.checked;
        if (cb.checked) goals[idx].doneAt = Date.now(); else delete goals[idx].doneAt;
        storeSet(key, goals); reload();
      });
    }
    li.appendChild(cbWrap);

    // Text
    const textEl = document.createElement('span');
    textEl.className = 'gm-goal-text'; textEl.textContent = g.text;
    makeInlineEdit(textEl, goals, idx, key, readOnly, reload);
    li.appendChild(textEl);

    // Queue
    const qBtn = document.createElement('button');
    qBtn.className = 'gm-queue-btn' + (g.queued ? ' gm-queue-active' : '');
    qBtn.textContent = '⚡'; qBtn.title = 'Queue for focus';
    if (readOnly) { qBtn.disabled = true; }
    else {
      qBtn.addEventListener('click', () => {
        goals[idx].queued = !goals[idx].queued;
        li.classList.add('is-queue-flashing');
        storeSet(key, goals);
        setTimeout(reload, 480);
      });
    }
    li.appendChild(qBtn);

    // Delete
    const delBtn = document.createElement('button');
    delBtn.className = 'goal-delete'; delBtn.textContent = '×'; delBtn.title = 'Delete';
    delBtn.addEventListener('click', () => { goals.splice(idx, 1); storeSet(key, goals); reload(); });
    li.appendChild(delBtn);

    return li;
  }

  // ── Render list ──
  function renderListInto(goals, listEl, emptyEl, key, readOnly) {
    if (!listEl) return;
    listEl.innerHTML = '';
    const LIMIT = 5;
    const showAll = listEl._showAll || false;
    const visible = showAll ? goals : goals.slice(0, LIMIT);

    function reload() { renderListInto(storeGet(key) || [], listEl, emptyEl, key, readOnly); }

    visible.forEach((g, i) => { listEl.appendChild(buildGoalRow(g, i, goals, key, readOnly, reload)); });

    if (goals.length > LIMIT) {
      const btn = document.createElement('button'); btn.className = 'gm-show-more';
      if (!showAll) {
        btn.textContent = `Show ${goals.length - LIMIT} more ▾`;
        btn.addEventListener('click', () => { listEl._showAll = true; reload(); });
      } else {
        btn.textContent = 'Show less ▴';
        btn.addEventListener('click', () => { listEl._showAll = false; reload(); });
      }
      listEl.appendChild(btn);
    }

    if (emptyEl) emptyEl.style.display = goals.length === 0 ? 'block' : 'none';

    wireDragReorder(listEl, key, readOnly, reload);

    const active = getActiveDateString();
    if (key === `goals:${active}`) renderTodayHeader(); else renderTomorrowCount();
  }

  function loadToday() {
    const key = `goals:${getActiveDateString()}`;
    renderListInto(storeGet(key) || [], document.getElementById('goalList'), document.getElementById('emptyState'), key, false);
  }

  function loadTomorrow() {
    const key = `goals:${getTomorrowDateString()}`;
    renderListInto(storeGet(key) || [], document.getElementById('tomorrowList'), document.getElementById('tomorrowEmptyState'), key, true);
  }

  // ── Add + Polish ──
  function makeAddHandlers(input, addBtn, polishBtn, getKey, statusEl, reload) {
    function addGoal(text) {
      text = text.trim(); if (!text) return;
      const key = getKey(); const goals = storeGet(key) || [];
      goals.push({ text, done: false }); storeSet(key, goals); input.value = ''; reload();
    }
    function showStatus(msg, color) {
      statusEl.textContent = msg; statusEl.style.color = color || '';
      setTimeout(() => { if (statusEl.textContent === msg) { statusEl.textContent = ''; statusEl.style.color = ''; } }, 3500);
    }

    addBtn.addEventListener('click', () => addGoal(input.value));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addGoal(input.value); });

    polishBtn.addEventListener('click', async () => {
      const raw = input.value.trim(); if (!raw) return;
      if (!ANTHROPIC_API_KEY) { addGoal(raw); showStatus('Polish needs an Anthropic API key — added as-typed.'); return; }

      polishBtn.disabled = true; polishBtn.textContent = '…'; showStatus('Polishing…');
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': ANTHROPIC_API_KEY,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-5', max_tokens: 1000,
            messages: [{ role: 'user', content: `Clean up this goal into a clear, actionable task. Return ONLY a JSON array with exactly one string, no preamble, no code fences. Goal: "${raw}"` }],
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const parsed = JSON.parse(data.content?.[0]?.text || '[]');
        const polished = Array.isArray(parsed) && parsed[0] ? parsed[0] : raw;
        const key = getKey(); const goals = storeGet(key) || [];
        goals.push({ text: polished, done: false }); storeSet(key, goals); input.value = ''; reload();
        showStatus('');
      } catch {
        addGoal(raw); showStatus('Polish failed — added as-typed.', 'var(--danger)');
      } finally {
        polishBtn.disabled = false; polishBtn.textContent = '✨ Polish';
      }
    });
  }

  // ── Push remaining ──
  document.getElementById('gmPushBtn').addEventListener('click', () => {
    if (!confirm('Push all unchecked goals to tomorrow?')) return;
    const todayKey    = `goals:${getActiveDateString()}`;
    const tomorrowKey = `goals:${getTomorrowDateString()}`;
    const todayGoals    = storeGet(todayKey)    || [];
    const tomorrowGoals = storeGet(tomorrowKey) || [];
    const tomorrowTexts = new Set(tomorrowGoals.map(g => g.text));
    todayGoals.filter(g => !g.done).forEach(g => {
      if (!tomorrowTexts.has(g.text)) { tomorrowGoals.push({ text: g.text, done: false }); tomorrowTexts.add(g.text); }
    });
    storeSet(todayKey, todayGoals.filter(g => g.done));
    storeSet(tomorrowKey, tomorrowGoals);
    loadToday(); loadTomorrow();
  });

  // ── Day ring ──
  const CIRC = 2 * Math.PI * 52;
  const SUN = [
    [255,216,158],[255,205,121],[255,227,143],[255,183,106],
    [255,149, 89],[243,111, 79],[226, 93,122],[123, 91,176],[47,58,102],
  ];

  function lerpColor(pct) {
    const t = pct / 100 * 8;
    const i = Math.min(Math.floor(t), 7);
    const f = t - i;
    const a = SUN[i], b = SUN[i + 1];
    return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
  }

  function fmtHM(mins) {
    const h = Math.floor(mins / 60), m = Math.round(mins % 60);
    if (h === 0) return `${m}m`; if (m === 0) return `${h}h`; return `${h}h ${m}m`;
  }

  function fmtClock(now) {
    let h = now.getHours(); const m = String(now.getMinutes()).padStart(2,'0');
    const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return `${h}:${m} ${ap}`;
  }

  function updateDayBar() {
    const now = new Date();
    const hrs = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    const fill      = document.getElementById('dayRingFill');
    const percentEl = document.getElementById('dayRingPercent');
    const phaseEl   = document.getElementById('dayRingPhase');
    const clockEl   = document.getElementById('dayRingClock');
    const statusEl  = document.getElementById('dayRingStatus');
    const remEl     = document.getElementById('dayRingRemaining');

    clockEl.textContent = fmtClock(now);

    if (hrs < WAKE_HOUR) {
      fill.setAttribute('stroke', '#4D4B47');
      fill.setAttribute('stroke-dashoffset', CIRC);
      percentEl.textContent = '—'; phaseEl.textContent = 'SLEEPING';
      statusEl.textContent  = '😴 Still sleeping';
      remEl.textContent     = `${fmtHM((WAKE_HOUR - hrs) * 60)} until wake-up`;
    } else if (hrs >= SLEEP_HOUR) {
      fill.setAttribute('stroke', '#E25D7A');
      fill.setAttribute('stroke-dashoffset', 0);
      percentEl.textContent = '100%'; phaseEl.textContent = 'PAST BEDTIME';
      statusEl.textContent  = '⚠️ Past bedtime'; remEl.textContent = 'Sleep!';
    } else {
      const pct = (hrs - WAKE_HOUR) / (SLEEP_HOUR - WAKE_HOUR) * 100;
      fill.setAttribute('stroke-dashoffset', CIRC * (1 - pct / 100));
      fill.setAttribute('stroke', lerpColor(pct));
      percentEl.textContent = `${Math.round(pct)}%`;

      const [phase, status] =
        pct < 25 ? ['MORNING',   '☀️ Morning — fresh start'] :
        pct < 50 ? ['MIDDAY',    '⚡ Midday — keep moving']  :
        pct < 75 ? ['AFTERNOON', '🔥 Afternoon — push it']   :
        pct < 90 ? ['EVENING',   '⏳ Evening — wrap up']     :
                   ['BEDTIME',   '🌙 Bedtime soon'];

      phaseEl.textContent = phase; statusEl.textContent = status;
      remEl.textContent   = `${fmtHM((SLEEP_HOUR - hrs) * 60)} awake time left`;
    }
  }

  // ── Ticker ──
  let tickerItems = [], cycleIdx = 0;

  function buildTickerItems() {
    const goals = storeGet(`goals:${getActiveDateString()}`) || [];
    const total = goals.length, done = goals.filter(g => g.done).length;
    if (total === 0) return [{ status: 'empty',   text: 'No goals set for today — add one to get rolling.' }];
    if (done === total) return [{ status: 'done', text: '✓ All goals done — solid day.' }];
    return goals.filter(g => !g.done).map(g => ({ status: 'pending', text: g.text }));
  }

  function tickerMeta() {
    const goals = storeGet(`goals:${getActiveDateString()}`) || [];
    return `${goals.filter(g => g.done).length}/${goals.length}`;
  }

  function tick(first) {
    tickerItems = buildTickerItems();
    if (cycleIdx >= tickerItems.length) cycleIdx = 0;
    const item = tickerItems[cycleIdx];
    cycleIdx = (cycleIdx + 1) % Math.max(tickerItems.length, 1);

    document.getElementById('goalTickerMeta').textContent = tickerMeta();

    const stage    = document.getElementById('goalTickerStage');
    const existing = stage.querySelector('.goal-ticker-row');

    const row = document.createElement('div'); row.className = 'goal-ticker-row';
    const st  = document.createElement('span'); st.className = 'goal-ticker-status'; st.dataset.status = item.status;
    st.textContent = item.status === 'done' ? '✓' : item.status === 'pending' ? '○' : '·';
    const tx  = document.createElement('span'); tx.className = 'goal-ticker-text'; tx.textContent = item.text;
    row.appendChild(st); row.appendChild(tx);

    if (first || !existing) {
      stage.innerHTML = ''; stage.appendChild(row);
    } else {
      existing.classList.add('is-leaving');
      setTimeout(() => existing.remove(), 460);
      row.classList.add('is-entering');
      stage.appendChild(row);
    }
  }

  window.addEventListener('goals-changed', () => { cycleIdx = 0; tick(false); });

  // ── Init ──
  runRollover();
  runStreakCheck();
  renderStreak();

  makeAddHandlers(
    document.getElementById('goalInput'),
    document.getElementById('goalAddBtn'),
    document.getElementById('goalPolishBtn'),
    getActiveDateString,
    document.getElementById('polishStatus'),
    loadToday
  );

  makeAddHandlers(
    document.getElementById('tomorrowInput'),
    document.getElementById('tomorrowAddBtn'),
    document.getElementById('tomorrowPolishBtn'),
    getTomorrowDateString,
    document.getElementById('tomorrowStatus'),
    loadTomorrow
  );

  loadToday();
  loadTomorrow();
  updateDayBar();
  setInterval(updateDayBar, 60 * 1000);
  tick(true);
  setInterval(tick, 5000);
</script>
</body>
</html>
